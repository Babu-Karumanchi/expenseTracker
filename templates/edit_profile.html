{% extends "base.html" %}

{% block title %}Edit Profile — Spendly{% endblock %}

{% block content %}
<section class="profile-section">
    <div class="profile-card edit-profile-card">
        <h2 class="profile-card-title">Edit Profile</h2>
        <p class="modal-body">Update your personal details. Your password cannot be changed from here.</p>

        {% if error %}
            <p class="profile-filter-status profile-filter-status--danger">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('edit_profile') }}" class="profile-filter" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="edit-name" class="form-field-label">Name <span class="add-expense-required">*</span></label>
                <input type="text" name="name" id="edit-name" required
                       class="form-input form-field-input" 
                       value="{{ name }}" placeholder="Your full name">
            </div>

            <div class="form-group">
                <label for="edit-email" class="form-field-label">Email <span class="add-expense-required">*</span></label>
                <input type="email" name="email" id="edit-email" required
                       class="form-input form-field-input" 
                       value="{{ email }}" placeholder="email@example.com">
            </div>

            <div class="profile-filter-actions">
                <button type="submit" class="btn-apply">Save Changes</button>
                <a class="btn-ghost" href="{{ url_for('profile') }}">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
